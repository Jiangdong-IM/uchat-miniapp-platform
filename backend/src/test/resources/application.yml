spring:
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:miniapp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

platform:
  cors-allowed-origins: http://localhost:5176,http://127.0.0.1:5176
  session-hours: 24
  bootstrap-admin-password: test-admin-password-123
  asset-public-base-url:

integration:
  uchat:
    base-url: http://localhost:18080
    internal-token: test-internal-token
