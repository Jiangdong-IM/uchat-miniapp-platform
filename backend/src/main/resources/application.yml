spring:
  application:
    name: uchat-miniapp-platform
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MINIAPP_MAX_FILE_SIZE:50MB}
      max-request-size: ${MINIAPP_MAX_REQUEST_SIZE:52MB}

server:
  port: ${MINIAPP_BACKEND_PORT:8091}
  error:
    include-message: never
    include-stacktrace: never

platform:
  cors-allowed-origins: ${MINIAPP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session-hours: ${MINIAPP_SESSION_HOURS:24}
  bootstrap-admin-password: ${MINIAPP_BOOTSTRAP_ADMIN_PASSWORD:}
  asset-public-base-url: ${MINIAPP_ASSET_PUBLIC_BASE_URL:}

integration:
  uchat:
    base-url: ${UCHAT_SERVER_BASE_URL:}
    internal-token: ${UCHAT_MINI_APP_INTERNAL_TOKEN:}

logging:
  level:
    root: INFO
    com.uchat.miniapp.platform: INFO
